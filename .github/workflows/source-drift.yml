name: Source Drift

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: source-drift-main
  cancel-in-progress: false

jobs:
  drift:
    name: Verify source and dependency drift
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout protected default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up MSYS2 GnuPG
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          update: true
          install: >-
            gnupg
            tar
      - name: Resolve independent prerequisites
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $tools = [ordered]@{
            STICKERFIT_GPG_PATH = Join-Path $env:MSYS2_LOCATION "usr\bin\gpg.exe"
            STICKERFIT_GPGV_PATH = Join-Path $env:MSYS2_LOCATION "usr\bin\gpgv.exe"
            STICKERFIT_TAR_PATH = Join-Path $env:MSYS2_LOCATION "usr\bin\tar.exe"
          }
          foreach ($entry in $tools.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Value -PathType Leaf)) { throw "Missing $($entry.Value)." }
            $versionOutput = @(& $entry.Value --version 2>&1)
            $versionExitCode = $LASTEXITCODE
            if ($versionExitCode -ne 0) { throw "$($entry.Key) version check failed." }
            $versionLine = @($versionOutput | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ } | Select-Object -First 1)
            if ($versionLine.Count -ne 1) { throw "$($entry.Key) did not report a version." }
            Write-Host $versionLine[0]
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$($entry.Key)=$($entry.Value)"
          }
      - name: Assert lockfiles start clean
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Lockfiles changed before drift verification." }
          $tracked = git status --short --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $tracked) { throw "Tracked files are dirty before drift verification: $tracked" }
      - name: Verify official FFmpeg source
        run: |
          & .\tools\ffmpeg\build-minimal-ffmpeg.ps1 `
            -VerifySourceOnly `
            -GpgPath $env:STICKERFIT_GPG_PATH `
            -GpgvPath $env:STICKERFIT_GPGV_PATH `
            -TarPath $env:STICKERFIT_TAR_PATH
      - name: Verify tracked FFmpeg vendor
        run: |
          & .\tools\ffmpeg\build-minimal-ffmpeg.ps1 -VerifyVendorArtifacts
      - name: Set up Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Set up Rust 1.96.1
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.96.1"
          cache: false
      - name: Install and run exact cargo-audit outside the checkout
        run: |
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if ($runnerTemp -eq $workspace -or
              $runnerTemp.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "RUNNER_TEMP must be outside GITHUB_WORKSPACE for cargo-audit isolation."
          }

          $auditRoot = Join-Path $runnerTemp ("stickerfit-cargo-audit-" + [Guid]::NewGuid().ToString("N"))
          $auditRoot = [System.IO.Path]::GetFullPath($auditRoot)
          if ($auditRoot -eq $workspace -or
              $auditRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "The cargo-audit work directory must be outside GITHUB_WORKSPACE."
          }
          $cargoHome = Join-Path $auditRoot "cargo-home"
          $cargoTarget = Join-Path $auditRoot "target"
          $lockPath = [System.IO.Path]::GetFullPath(
            (Join-Path $workspace "src-tauri\Cargo.lock")
          )
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw "Cargo.lock is missing: $lockPath"
          }
          [System.IO.Directory]::CreateDirectory($cargoHome) | Out-Null
          [System.IO.Directory]::CreateDirectory($cargoTarget) | Out-Null

          $env:CARGO_HOME = $cargoHome
          $env:CARGO_TARGET_DIR = $cargoTarget
          Push-Location $auditRoot
          try {
            $cargo = Get-Command cargo.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
            $cargoPath = [System.IO.Path]::GetFullPath($cargo.Source)
            if ($cargoPath -eq $workspace -or
                $cargoPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "The selected Cargo executable must be outside GITHUB_WORKSPACE."
            }

            & $cargoPath install cargo-audit --version 0.22.2 --locked --root $cargoHome
            if ($LASTEXITCODE -ne 0) { throw "cargo-audit installation failed." }

            $auditPath = Join-Path $cargoHome "bin\cargo-audit.exe"
            if (-not (Test-Path -LiteralPath $auditPath -PathType Leaf)) {
              throw "cargo-audit executable was not installed at the isolated path."
            }
            $versionOutput = & $auditPath --version 2>&1
            $versionExitCode = $LASTEXITCODE
            $version = ($versionOutput | Out-String).Trim()
            if ($versionExitCode -ne 0 -or $version -ne "cargo-audit 0.22.2") {
              throw "Expected cargo-audit 0.22.2, got '$version'."
            }

            & $auditPath audit --file $lockPath
            if ($LASTEXITCODE -ne 0) { throw "cargo-audit failed." }
          }
          finally {
            Pop-Location
          }
      - name: Audit JavaScript dependencies outside the checkout
        run: |
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/')
          $workspacePrefix = $workspace + [System.IO.Path]::DirectorySeparatorChar
          if ($runnerTemp -eq $workspace -or
              $runnerTemp.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "RUNNER_TEMP must be outside GITHUB_WORKSPACE for npm audit isolation."
          }

          $auditRoot = Join-Path $runnerTemp ("stickerfit-npm-audit-" + [Guid]::NewGuid().ToString("N"))
          $auditRoot = [System.IO.Path]::GetFullPath($auditRoot)
          if ($auditRoot -eq $workspace -or
              $auditRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "The npm audit work directory must be outside GITHUB_WORKSPACE."
          }
          [System.IO.Directory]::CreateDirectory($auditRoot) | Out-Null

          foreach ($name in @("package.json", "package-lock.json")) {
            $source = Join-Path $workspace $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "JavaScript dependency manifest is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $auditRoot $name)
          }
          $userConfig = Join-Path $auditRoot "npm-user-config"
          [System.IO.File]::WriteAllText($userConfig, "")
          $env:NPM_CONFIG_USERCONFIG = $userConfig
          $env:NPM_CONFIG_IGNORE_SCRIPTS = "true"

          Push-Location $auditRoot
          try {
            $npm = Get-Command npm.cmd -CommandType Application -ErrorAction Stop | Select-Object -First 1
            $npmPath = [System.IO.Path]::GetFullPath($npm.Source)
            if ($npmPath -eq $workspace -or
                $npmPath.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "The selected npm executable must be outside GITHUB_WORKSPACE."
            }

            & $npmPath audit `
              --package-lock-only `
              --ignore-scripts `
              --audit-level=moderate `
              --registry=https://registry.npmjs.org/
            if ($LASTEXITCODE -ne 0) { throw "npm audit failed." }
          }
          finally {
            Pop-Location
          }
      - name: Assert verification was read-only
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Drift verification changed a lockfile." }
          $tracked = git status --short --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $tracked) { throw "Drift verification changed tracked files: $tracked" }
